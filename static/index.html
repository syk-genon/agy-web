<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlackNote - Log & Memo</title>
  <style>
    :root {
      --bg-color: #0b0c0e;
      --sidebar-bg: #111317;
      --card-q: #16191f;
      --card-a: #1c2027;
      --border-color: #262b35;
      --text-main: #d1d5db;
      --text-dim: #71717a;
      --accent: #3b82f6;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 280px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 14px;
      flex-shrink: 0;
      z-index: 10;
    }
    .sidebar-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .new-btn {
      background-color: #1a1e27;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      transition: 0.15s;
    }
    .new-btn:hover { background-color: #242a36; }
    
    .session-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 28vh;
    }
    .session-item {
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 5px;
      cursor: pointer;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid transparent;
    }
    .session-item:hover { background-color: #181c24; color: var(--text-main); }
    .session-item.active {
      background-color: #1e2533;
      border-color: #3b82f6;
      color: #fff;
      font-weight: 600;
    }

    /* Model Selector */
    .select-box {
      width: 100%;
      background-color: #161920;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 9px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    .model-badge {
      font-size: 10px;
      color: #93c5fd;
      margin-top: 4px;
      display: block;
      word-break: break-all;
    }

    /* Quota Panel */
    .usage-panel {
      background: #14161c;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .gauge-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    .gauge-title { color: #9ca3af; font-weight: 600; }
    .gauge-stat { color: #38bdf8; font-weight: 600; font-family: monospace; font-size: 11px; }
    .gauge-subtext {
      font-size: 10px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      margin-top: 3px;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #242933;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent-green);
      width: 0%;
      transition: width 0.4s ease;
    }
    .progress-fill.warning { background: var(--accent-orange); }
    .progress-fill.danger { background: #ef4444; }

    /* Main Content */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100vh;
      background-color: var(--bg-color);
    }
    .header-bar {
      height: 48px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .multiturn-tag {
      font-size: 10px;
      background: #1e293b;
      color: #38bdf8;
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .feed-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
      padding-bottom: 150px;
    }

    /* Cards */
    .comment-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      padding: 16px 18px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      border: 1px solid var(--border-color);
      word-break: break-word;
      white-space: pre-wrap;
    }
    .card.question {
      background-color: var(--card-q);
      border-left: 3px solid #60a5fa;
    }
    .card.answer {
      background-color: var(--card-a);
      border-left: 3px solid var(--accent-green);
      margin-left: 14px;
    }
    .meta-tag {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .card.loading {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-dim);
      font-style: italic;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #374151;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Input Bar */
    .input-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, rgba(11,12,14,0.3) 0%, rgba(11,12,14,0.98) 35%);
      padding: 18px 20% 24px 20%;
      display: flex;
      gap: 10px;
      backdrop-filter: blur(8px);
    }
    textarea {
      flex: 1;
      background-color: #171a21;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      resize: none;
      font-size: 14px;
      outline: none;
      height: 52px;
      line-height: 1.4;
      font-family: inherit;
    }
    textarea:focus { border-color: var(--accent); }
    .send-btn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      height: 52px;
    }
    .send-btn:hover { background-color: #2563eb; }
    .send-btn:disabled { background-color: #374151; cursor: not-allowed; }

    @media (max-width: 900px) {
      .feed-container { padding: 16px 5% 150px 5%; }
      .input-bar { padding: 16px 5% 20px 5%; }
      #sidebar { width: 240px; }
    }
  </style>
</head>
<body>

  <!-- 사이드바 -->
  <aside id="sidebar">
    <div class="sidebar-title">Workspaces</div>
    <button class="new-btn" onclick="createNewSession()">+ 새 메모 세션</button>

    <div class="sidebar-title" style="margin-top: 4px;">Recent Sessions</div>
    <div class="session-list" id="sessionList"></div>

    <!-- 실제 인프라 매핑 모델 셀렉터 -->
    <div class="sidebar-title">Active Engine</div>
    <div>
      <select class="select-box" id="modelSelector" onchange="onModelChanged()">
        <optgroup label="NVIDIA Build (Direct API)">
          <option value="nvidia/nemotron-3.5-super-vl-120b-a12b" selected>Nemotron 3.5 Super VL 120B</option>
          <option value="meta/llama-3.1-405b-instruct">Llama 3.1 405B Instruct</option>
        </optgroup>
        <optgroup label="Google Vertex AI">
          <option value="vertex-gemini-pro">Vertex AI (Gemini Pro / agy Core)</option>
        </optgroup>
        <optgroup label="Anthropic Claude">
          <option value="claude-3-5-sonnet">Claude 3.5 Sonnet</option>
        </optgroup>
      </select>
      <span class="model-badge" id="modelTierInfo">NVIDIA Build API / 5시간 세션 쿼터</span>
    </div>

    <!-- 모델별 실시간 쿼터 -->
    <div class="sidebar-title" id="quotaSectionTitle">Quota Status</div>
    <div class="usage-panel">
      <div>
        <div class="gauge-header">
          <span class="gauge-title">5시간 세션 쿼터</span>
          <span class="gauge-stat" id="sessionUsedPercent">사용 0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="sessionProgressBar"></div>
        </div>
        <div class="gauge-subtext">
          <span>잔여: <b id="sessionRemainingPercent" style="color:#10b981;">100%</b></span>
          <span id="sessionResetTime">5시간 주기</span>
        </div>
      </div>

      <div>
        <div class="gauge-header">
          <span class="gauge-title">주간 누적 쿼터</span>
          <span class="gauge-stat" id="weeklyUsedPercent">사용 0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="weeklyProgressBar"></div>
        </div>
        <div class="gauge-subtext">
          <span>잔여: <b id="weeklyRemainingPercent" style="color:#10b981;">100%</b></span>
          <span id="weeklyResetTime">매주 월요일 갱신</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- 메인 피드 -->
  <main id="main">
    <div class="header-bar">
      <span id="currentSessionTitle">메모 세션 #1</span>
      <span class="multiturn-tag">Multi-Turn Context ON</span>
    </div>

    <div class="feed-container" id="feedContainer"></div>

    <div class="input-bar">
      <textarea id="promptInput" placeholder="질문이나 메모할 내용을 입력하세요... (Enter로 전송, Shift+Enter 줄바꿈)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">작성</button>
    </div>
  </main>

  <script>
    const MODEL_PROFILES = {
      "nvidia/nemotron-3.5-super-vl-120b-a12b": { name: "Nemotron 120B", weight: 2.0, tier: "NVIDIA Build API / 120B 파라미터" },
      "meta/llama-3.1-405b-instruct": { name: "Llama 3.1 405B", weight: 4.5, tier: "NVIDIA Build API / 405B 초거대 파라미터" },
      "vertex-gemini-pro": { name: "Vertex AI (Gemini)", weight: 1.8, tier: "Google Cloud Vertex AI Enterprise" },
      "claude-3-5-sonnet": { name: "Claude 3.5 Sonnet", weight: 2.5, tier: "Anthropic API 롤링 윈도우" }
    };

    let sessions = JSON.parse(localStorage.getItem("agy_sessions") || "[]");
    let currentSessionId = localStorage.getItem("agy_current_session") || null;
    let modelUsageLogs = JSON.parse(localStorage.getItem("agy_model_usage_logs") || "{}");

    function getSelectedModel() {
      return document.getElementById("modelSelector").value;
    }

    function onModelChanged() {
      updateUsageGauges();
    }

    function updateUsageGauges() {
      const modelKey = getSelectedModel();
      const profile = MODEL_PROFILES[modelKey] || { name: modelKey, weight: 2.0, tier: "기본 엔진" };
      
      document.getElementById("quotaSectionTitle").textContent = `${profile.name} 쿼터`;
      document.getElementById("modelTierInfo").textContent = profile.tier;

      const now = Date.now();
      const fiveHoursAgo = now - (5 * 60 * 60 * 1000);
      const sevenDaysAgo = now - (7 * 24 * 60 * 60 * 1000);

      if (!modelUsageLogs[modelKey]) modelUsageLogs[modelKey] = [];
      modelUsageLogs[modelKey] = modelUsageLogs[modelKey].filter(log => log.ts >= sevenDaysAgo);
      localStorage.setItem("agy_model_usage_logs", JSON.stringify(modelUsageLogs));

      const currentLogs = modelUsageLogs[modelKey];
      const sessionLogs = currentLogs.filter(log => log.ts >= fiveHoursAgo);
      const sessionUsedPct = Math.min(100, Math.round(sessionLogs.reduce((acc, cur) => acc + cur.costPct, 0)));
      const sessionRemainPct = Math.max(0, 100 - sessionUsedPct);

      const weeklyTotalPct = Math.min(100, Math.round(currentLogs.reduce((acc, cur) => acc + (cur.costPct * 0.4), 0)));
      const weeklyRemainPct = Math.max(0, 100 - weeklyTotalPct);

      let sessionResetText = "5시간 주기";
      if (sessionLogs.length > 0) {
        const oldest = sessionLogs[0].ts;
        const diffMs = (oldest + 5 * 60 * 60 * 1000) - now;
        if (diffMs > 0) {
          const hrs = Math.floor(diffMs / (1000 * 60 * 60));
          const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
          sessionResetText = `${hrs}시간 ${mins}분 후 리셋`;
        }
      }

      document.getElementById("sessionUsedPercent").textContent = `사용 ${sessionUsedPct}%`;
      document.getElementById("sessionRemainingPercent").textContent = `${sessionRemainPct}%`;
      const sessBar = document.getElementById("sessionProgressBar");
      sessBar.style.width = sessionUsedPct + "%";
      sessBar.className = `progress-fill ${sessionUsedPct > 80 ? 'danger' : sessionUsedPct > 55 ? 'warning' : ''}`;
      document.getElementById("sessionResetTime").textContent = sessionResetText;

      document.getElementById("weeklyUsedPercent").textContent = `사용 ${weeklyTotalPct}%`;
      document.getElementById("weeklyRemainingPercent").textContent = `${weeklyRemainPct}%`;
      const weekBar = document.getElementById("weeklyProgressBar");
      weekBar.style.width = weeklyTotalPct + "%";
      weekBar.className = `progress-fill ${weeklyTotalPct > 80 ? 'danger' : weeklyTotalPct > 55 ? 'warning' : ''}`;
    }

    function recordUsage(modelKey, promptLength) {
      const profile = MODEL_PROFILES[modelKey] || { weight: 2.0 };
      const lengthMultiplier = Math.min(2.5, 1 + (promptLength / 800));
      const costPct = parseFloat((profile.weight * lengthMultiplier).toFixed(1));

      if (!modelUsageLogs[modelKey]) modelUsageLogs[modelKey] = [];
      modelUsageLogs[modelKey].push({
        ts: Date.now(),
        costPct: costPct
      });
      localStorage.setItem("agy_model_usage_logs", JSON.stringify(modelUsageLogs));
      updateUsageGauges();
    }

    function scrollToBottom(force = false) {
      const feed = document.getElementById("feedContainer");
      setTimeout(() => {
        feed.scrollTo({
          top: feed.scrollHeight,
          behavior: force ? "auto" : "smooth"
        });
      }, 30);
    }

    function init() {
      if (!sessions.length) {
        const newId = "sess_" + Date.now();
        sessions.push({
          id: newId,
          title: "메모 세션 #1",
          items: []
        });
        currentSessionId = newId;
        saveSessions();
      } else if (!currentSessionId) {
        currentSessionId = sessions[0].id;
      }
      renderSessionList();
      renderFeed();
      updateUsageGauges();
      setInterval(updateUsageGauges, 60000);
    }

    function saveSessions() {
      localStorage.setItem("agy_sessions", JSON.stringify(sessions));
      localStorage.setItem("agy_current_session", currentSessionId);
    }

    function createNewSession() {
      const newId = "sess_" + Date.now();
      sessions.unshift({
        id: newId,
        title: `메모 세션 #${sessions.length + 1}`,
        items: []
      });
      currentSessionId = newId;
      saveSessions();
      renderSessionList();
      renderFeed();
    }

    function switchSession(id) {
      currentSessionId = id;
      saveSessions();
      renderSessionList();
      renderFeed();
    }

    function getCurrentSession() {
      return sessions.find(s => s.id === currentSessionId) || sessions[0];
    }

    function renderSessionList() {
      const listEl = document.getElementById("sessionList");
      listEl.innerHTML = "";
      sessions.forEach(sess => {
        const item = document.createElement("div");
        item.className = `session-item ${sess.id === currentSessionId ? 'active' : ''}`;
        item.textContent = sess.title || "새 메모 세션";
        item.onclick = () => switchSession(sess.id);
        listEl.appendChild(item);
      });
      const cur = getCurrentSession();
      document.getElementById("currentSessionTitle").textContent = cur ? cur.title : "메모";
    }

    function renderFeed() {
      const feed = document.getElementById("feedContainer");
      feed.innerHTML = "";
      const sess = getCurrentSession();
      if (!sess || !sess.items || sess.items.length === 0) {
        feed.innerHTML = `<div style="color: #4b5563; font-size: 13px; text-align: center; margin-top: 40px;">새로운 질문이나 아이디어를 남기면 백그라운드 연산 후 댓글로 추가됩니다. (멀티턴 컨텍스트 유지)</div>`;
        return;
      }

      sess.items.forEach(pair => {
        const block = document.createElement("div");
        block.className = "comment-block";

        const qCard = document.createElement("div");
        qCard.className = "card question";
        qCard.innerHTML = `<div class="meta-tag"><span>USER NOTE</span><span>${pair.time || ''}</span></div><div>${escapeHtml(pair.question)}</div>`;
        block.appendChild(qCard);

        if (pair.answer !== undefined) {
          const aCard = document.createElement("div");
          aCard.className = "card answer";
          aCard.innerHTML = `<div class="meta-tag"><span style="color:#10b981;">ENGINE RESPONSE (${escapeHtml(pair.model || 'agy')})</span></div><div>${escapeHtml(pair.answer)}</div>`;
          block.appendChild(aCard);
        }

        feed.appendChild(block);
      });

      scrollToBottom(true);
    }

    async function sendMessage() {
      const input = document.getElementById("promptInput");
      const text = input.value.trim();
      if (!text) return;

      const btn = document.getElementById("sendBtn");
      const selectedModel = getSelectedModel();
      input.value = "";
      btn.disabled = true;

      const sess = getCurrentSession();
      if (sess.items.length === 0) {
        sess.title = text.slice(0, 18) + (text.length > 18 ? '...' : '');
        renderSessionList();
      }

      // ★ [핵심 멀티턴 생성]: 이전 대화 내역 전체를 messages 배열로 조립
      const conversationHistory = [];
      sess.items.forEach(item => {
        if (item.question) {
          conversationHistory.push({ role: "user", content: item.question });
        }
        if (item.answer && !item.answer.startsWith("[")) {
          conversationHistory.push({ role: "assistant", content: item.answer });
        }
      });
      // 이번 새 질문 추가
      conversationHistory.push({ role: "user", content: text });

      // 쿼터 누적 기록
      recordUsage(selectedModel, text.length);

      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const itemIndex = sess.items.length;
      sess.items.push({
        question: text,
        time: now,
        model: MODEL_PROFILES[selectedModel]?.name || selectedModel
      });
      saveSessions();
      renderFeed();

      const feed = document.getElementById("feedContainer");
      const loadingCard = document.createElement("div");
      loadingCard.className = "card answer loading";
      loadingCard.id = "loadingAnswer";
      loadingCard.innerHTML = `<div class="spinner"></div><span>연산 중... 답변을 완성하고 있습니다.</span>`;
      feed.appendChild(loadingCard);
      scrollToBottom();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: text,
            messages: conversationHistory, // ★ 전체 멀티턴 히스토리 전달
            model: selectedModel,
            sessionId: sess.id
          })
        });

        const data = await response.json();
        const answerText = data.reply || data.output || "응답을 받아오지 못했습니다.";
        sess.items[itemIndex].answer = answerText;
      } catch (err) {
        sess.items[itemIndex].answer = "[연결 실패]: 백엔드 서버 응답이 없습니다.";
      } finally {
        saveSessions();
        renderFeed();
        btn.disabled = false;
        input.focus();
        scrollToBottom();
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById("promptInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    window.onload = init;
  </script>
</body>
</html>
