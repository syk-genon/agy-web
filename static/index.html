<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity (agy) Web Console</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a24;
      --panel-hover: #212636;
      --border: #2a2f42;
      --text: #e6e9f2;
      --muted: #939bb4;
      --accent: #4f8cff;
      --accent-hover: #3b79ee;
      --user-bg: #223354;
      --bot-bg: #181d2a;
      --tool-bg: #1c2638;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.3px;
    }
    .status-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.35);
    }
    .status-badge.warn {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.35);
    }
    .controls-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    select, .btn-action {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.83rem;
      outline: none;
      cursor: pointer;
      transition: all 0.15s;
    }
    select:focus, .btn-action:hover {
      border-color: var(--accent);
    }
    .btn-action.primary {
      background: rgba(79, 140, 255, 0.15);
      color: #93bbfc;
      border-color: rgba(79, 140, 255, 0.4);
    }
    .btn-action.primary:hover {
      background: var(--accent);
      color: #fff;
    }
    .session-indicator {
      font-size: 0.75rem;
      color: var(--muted);
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 6px;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px 18px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      max-width: 82%;
      border-bottom-right-radius: 2px;
    }
    .msg.bot {
      align-self: stretch;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 2px;
    }
    .msg.system-notice {
      align-self: center;
      font-size: 0.82rem;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--border);
      padding: 6px 14px;
      border-radius: 999px;
    }
    .meta-block {
      font-size: 0.82rem;
      color: var(--muted);
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
    }
    .meta-block summary {
      cursor: pointer;
      font-weight: 600;
      user-select: none;
    }
    .meta-block pre {
      margin-top: 6px;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.78rem;
      color: #b7c0d8;
    }
    .tool-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      background: var(--tool-bg);
      border: 1px solid #334155;
      color: #93c5fd;
      padding: 4px 9px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .markdown-body pre {
      background: #090b10;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      border: 1px solid var(--border);
      margin: 8px 0;
    }
    .markdown-body code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.88em;
    }
    .markdown-body p { margin-bottom: 8px; }
    .markdown-body p:last-child { margin-bottom: 0; }
    
    footer {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
    }
    .input-wrap {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.95rem;
      resize: none;
      height: 48px;
      max-height: 150px;
      outline: none;
      font-family: inherit;
    }
    textarea:focus { border-color: var(--accent); }
    button.send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    button.send-btn:hover { background: var(--accent-hover); }
    button.send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(2px);
    }
    .modal-backdrop.active { display: flex; }
    .modal-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 92%;
      max-width: 580px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .modal-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.3rem;
      cursor: pointer;
    }
    .modal-body {
      padding: 14px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .conversation-item {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .conversation-item:hover {
      border-color: var(--accent);
      background: var(--panel-hover);
    }
    .conversation-title {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
    }
    .conversation-meta {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-wrap">
      <div class="brand">
        <span>🚀 Antigravity</span>
        <span id="statusBadge" class="status-badge">확인 중...</span>
      </div>
      <span id="sessionIndicator" class="session-indicator" title="현재 대화 ID">새 대화</span>
    </div>

    <div class="controls-wrap">
      <!-- Model Selector -->
      <select id="modelSelect" title="모델 선택">
        <option value="">모델 불러오는 중...</option>
      </select>

      <!-- Mode Selector -->
      <select id="modeSelect" title="실행 모드">
        <option value="auto">Auto (기본 에이전트)</option>
        <option value="plan">Plan (계획 수립)</option>
        <option value="accept-edits">Accept Edits (자동 적용)</option>
      </select>

      <!-- Resume Button -->
      <button id="resumeModalBtn" class="btn-action primary" title="이전 대화 목록 불러오기 (/resume)">📂 대화 이어하기</button>

      <!-- New Chat Button -->
      <button id="newChatBtn" class="btn-action" title="대화 초기화 (/reset)">새 대화</button>
    </div>
  </header>

  <main id="chatContainer">
    <div class="msg bot">
      <div class="markdown-body">
        안녕하세요! 웹 브라우저에서 동작하는 <strong>Antigravity (agy)</strong> 콘솔입니다.<br/>
        상단에서 <strong>모델</strong>과 <strong>모드</strong>를 변경하거나, <strong>📂 대화 이어하기</strong>를 통해 이전 대화를 언제든 다시 불러올 수 있습니다.<br/><br/>
        💡 <em>슬래시 명령어</em>: <code>/resume</code> (이전 대화 불러오기), <code>/reset</code> (새 대화), <code>/clear</code> (화면 지우기), <code>/help</code>
      </div>
    </div>
  </main>

  <footer>
    <form id="chatForm" class="input-wrap">
      <textarea id="promptInput" placeholder="메시지를 입력하세요... (/resume, /help 사용 가능)" required></textarea>
      <button type="submit" id="sendBtn" class="send-btn">전송</button>
    </form>
  </footer>

  <!-- Resume Conversations Modal -->
  <div id="resumeModal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-header">
        <span>📂 이전 대화 불러오기 (/resume)</span>
        <button id="closeModalBtn" class="modal-close">&times;</button>
      </div>
      <div id="conversationList" class="modal-body">
        <div style="text-align: center; color: var(--muted); padding: 20px;">대화 목록을 불러오는 중...</div>
      </div>
    </div>
  </div>

  <script>
    const chatContainer = document.getElementById('chatContainer');
    const chatForm = document.getElementById('chatForm');
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusBadge = document.getElementById('statusBadge');
    const sessionIndicator = document.getElementById('sessionIndicator');
    const modelSelect = document.getElementById('modelSelect');
    const modeSelect = document.getElementById('modeSelect');
    const newChatBtn = document.getElementById('newChatBtn');
    const resumeModalBtn = document.getElementById('resumeModalBtn');
    const resumeModal = document.getElementById('resumeModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const conversationList = document.getElementById('conversationList');

    let currentConversationId = null;

    function addNotice(text) {
      const div = document.createElement('div');
      div.className = 'msg system-notice';
      div.textContent = text;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function updateSessionIndicator(id) {
      currentConversationId = id;
      if (id) {
        sessionIndicator.textContent = `세션: ${id.slice(0, 8)}...`;
        sessionIndicator.title = `Conversation ID: ${id}`;
      } else {
        sessionIndicator.textContent = '새 대화';
        sessionIndicator.title = '새 대화 세션';
      }
    }

    async function loadStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        if (data.sdk_available) {
          statusBadge.textContent = '준비됨';
          statusBadge.className = 'status-badge';
        } else {
          statusBadge.textContent = '오류';
          statusBadge.className = 'status-badge warn';
        }
        if (data.conversation_id) {
          updateSessionIndicator(data.conversation_id);
        }
      } catch {
        statusBadge.textContent = '오프라인';
        statusBadge.className = 'status-badge warn';
      }
    }

    async function loadModels() {
      try {
        const res = await fetch('/api/models');
        const data = await res.json();
        modelSelect.innerHTML = '';
        if (data.models && data.models.length > 0) {
          data.models.forEach((m, idx) => {
            const opt = document.createElement('option');
            opt.value = m.id;
            opt.textContent = m.name;
            if (m.id.includes('argon') || idx === 0) {
              opt.selected = true;
            }
            modelSelect.appendChild(opt);
          });
        }
      } catch (err) {
        modelSelect.innerHTML = '<option value="">기본 모델</option>';
      }
    }

    async function openResumeModal() {
      resumeModal.classList.add('active');
      conversationList.innerHTML = '<div style="text-align: center; color: var(--muted); padding: 20px;">불러오는 중...</div>';
      try {
        const res = await fetch('/api/conversations');
        const data = await res.json();
        const list = data.conversations || [];
        if (list.length === 0) {
          conversationList.innerHTML = '<div style="text-align: center; color: var(--muted); padding: 20px;">저장된 이전 대화가 없습니다.</div>';
          return;
        }
        conversationList.innerHTML = '';
        list.forEach(c => {
          const item = document.createElement('div');
          item.className = 'conversation-item';
          const dateStr = new Date(c.timestamp).toLocaleString('ko-KR', {
            month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
          });
          item.innerHTML = `
            <div class="conversation-title">${c.title}</div>
            <div class="conversation-meta">
              <span>ID: ${c.conversationId.slice(0, 8)}...</span>
              <span>${dateStr}</span>
            </div>
          `;
          item.addEventListener('click', async () => {
            await resumeConversation(c.conversationId, c.title);
            resumeModal.classList.remove('active');
          });
          conversationList.appendChild(item);
        });
      } catch (err) {
        conversationList.innerHTML = `<div style="color: var(--danger); padding: 20px;">목록을 불러오지 못했습니다: ${err.message}</div>`;
      }
    }

    async function resumeConversation(id, title) {
      try {
        const res = await fetch('/api/resume', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ conversationId: id })
        });
        const data = await res.json();
        if (data.ok) {
          updateSessionIndicator(id);
          addNotice(`📂 이전 대화 세션을 불러왔습니다: "${title || id.slice(0, 8)}"`);
        }
      } catch (err) {
        addNotice(`⚠️ 세션 불러오기 실패: ${err.message}`);
      }
    }

    async function resetSession() {
      await fetch('/api/reset', { method: 'POST' });
      updateSessionIndicator(null);
      chatContainer.innerHTML = `
        <div class="msg bot">
          <div class="markdown-body">새로운 대화 세션이 시작되었습니다. 무엇을 도와드릴까요?</div>
        </div>
      `;
    }

    resumeModalBtn.addEventListener('click', openResumeModal);
    closeModalBtn.addEventListener('click', () => resumeModal.classList.remove('active'));
    resumeModal.addEventListener('click', (e) => {
      if (e.target === resumeModal) resumeModal.classList.remove('active');
    });
    newChatBtn.addEventListener('click', resetSession);

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        chatForm.requestSubmit();
      }
    });

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = promptInput.value.trim();
      if (!message) return;

      // Handle Slash Commands
      if (message === '/resume') {
        promptInput.value = '';
        openResumeModal();
        return;
      }
      if (message === '/reset' || message === '/new') {
        promptInput.value = '';
        resetSession();
        return;
      }
      if (message === '/clear') {
        promptInput.value = '';
        chatContainer.innerHTML = '';
        return;
      }
      if (message === '/help') {
        promptInput.value = '';
        addNotice('💡 슬래시 명령어: /resume (이전 대화 목록), /reset (새 대화 세션), /clear (화면 지우기)');
        return;
      }

      promptInput.value = '';
      sendBtn.disabled = true;

      const userDiv = document.createElement('div');
      userDiv.className = 'msg user';
      userDiv.textContent = message;
      chatContainer.appendChild(userDiv);

      const botDiv = document.createElement('div');
      botDiv.className = 'msg bot';

      const thoughtsDetails = document.createElement('details');
      thoughtsDetails.className = 'meta-block';
      thoughtsDetails.style.display = 'none';
      thoughtsDetails.innerHTML = `<summary>💭 생각 과정 (Thinking...)</summary><pre></pre>`;
      const thoughtsPre = thoughtsDetails.querySelector('pre');

      const toolsWrap = document.createElement('div');
      toolsWrap.style.display = 'flex';
      toolsWrap.style.flexWrap = 'wrap';
      toolsWrap.style.gap = '6px';

      const answerDiv = document.createElement('div');
      answerDiv.className = 'markdown-body';
      answerDiv.textContent = '응답 생성 중...';

      botDiv.appendChild(thoughtsDetails);
      botDiv.appendChild(toolsWrap);
      botDiv.appendChild(answerDiv);
      chatContainer.appendChild(botDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      let rawMarkdown = '';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message,
            model: modelSelect.value,
            mode: modeSelect.value,
            conversationId: currentConversationId,
          }),
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const parts = buffer.split('\n\n');
          buffer = parts.pop() || '';

          for (const part of parts) {
            const cleanPart = part.trim();
            if (!cleanPart.startsWith('data: ')) continue;
            const payload = JSON.parse(cleanPart.slice(6));

            if (payload.type === 'session_init' || payload.type === 'done') {
              if (payload.conversationId) {
                updateSessionIndicator(payload.conversationId);
              }
            } else if (payload.type === 'thought') {
              thoughtsDetails.style.display = 'block';
              thoughtsPre.textContent += payload.content;
            } else if (payload.type === 'tool_call') {
              const pill = document.createElement('div');
              pill.className = 'tool-pill';
              pill.textContent = `🛠 ${payload.name}`;
              toolsWrap.appendChild(pill);
            } else if (payload.type === 'token') {
              rawMarkdown += payload.content;
              answerDiv.innerHTML = marked.parse(rawMarkdown);
            } else if (payload.type === 'error') {
              answerDiv.innerHTML = `<span style="color: #ef4444;">⚠️ 오류: ${payload.content}</span>`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
          }
        }
        if (!rawMarkdown && answerDiv.textContent === '응답 생성 중...') {
          answerDiv.textContent = '(응답 완료)';
        }
      } catch (err) {
        answerDiv.innerHTML = `<span style="color: #ef4444;">⚠️ 통신 오류: ${err.message}</span>`;
      } finally {
        sendBtn.disabled = false;
        promptInput.focus();
      }
    });

    loadStatus();
    loadModels();
  </script>
</body>
</html>
