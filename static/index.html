<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlackNote - Log & Memo</title>
  <style>
    :root {
      --bg-color: #0b0c0e;
      --sidebar-bg: #111317;
      --card-q: #16191f;
      --card-a: #1c2027;
      --border-color: #262b35;
      --text-main: #d1d5db;
      --text-dim: #6b7280;
      --accent: #3b82f6;
      --accent-green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 260px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 18px;
      flex-shrink: 0;
      z-index: 10;
    }
    .sidebar-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .new-btn {
      background-color: #1f242d;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      transition: 0.15s;
    }
    .new-btn:hover { background-color: #2b323e; }
    
    .session-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .session-item {
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 5px;
      cursor: pointer;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid transparent;
    }
    .session-item:hover { background-color: #1a1e26; color: var(--text-main); }
    .session-item.active {
      background-color: #1e2430;
      border-color: #3b82f6;
      color: #fff;
      font-weight: 600;
    }

    /* Model Selector */
    .select-box {
      width: 100%;
      background-color: #181b22;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }

    /* Usage Gauge */
    .usage-panel {
      background: #15181e;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .gauge-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
    }
    .progress-bar {
      width: 100%;
      height: 5px;
      background: #252a34;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent-green);
      width: 82%;
      transition: width 0.3s;
    }

    /* Main Content */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100vh;
      background-color: var(--bg-color);
    }
    .header-bar {
      height: 48px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .feed-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
      /* 마지막 메시지가 가려지지 않도록 넉넉한 하단 공간 확보 */
      padding-bottom: 140px;
    }

    /* Card Comments */
    .comment-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      padding: 16px 18px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      border: 1px solid var(--border-color);
      word-break: break-word;
      white-space: pre-wrap;
    }
    .card.question {
      background-color: var(--card-q);
      border-left: 3px solid #60a5fa;
    }
    .card.answer {
      background-color: var(--card-a);
      border-left: 3px solid var(--accent-green);
      margin-left: 14px;
    }
    .meta-tag {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    /* Loading skeleton for answer */
    .card.loading {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-dim);
      font-style: italic;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #374151;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Bottom Input Bar */
    .input-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, rgba(11,12,14,0.3) 0%, rgba(11,12,14,0.98) 35%);
      padding: 18px 20% 24px 20%;
      display: flex;
      gap: 10px;
      backdrop-filter: blur(8px);
    }
    textarea {
      flex: 1;
      background-color: #171a21;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      resize: none;
      font-size: 14px;
      outline: none;
      height: 52px;
      line-height: 1.4;
      font-family: inherit;
    }
    textarea:focus { border-color: var(--accent); }
    .send-btn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      height: 52px;
    }
    .send-btn:hover { background-color: #2563eb; }
    .send-btn:disabled { background-color: #374151; cursor: not-allowed; }

    @media (max-width: 900px) {
      .feed-container { padding: 16px 5% 140px 5%; }
      .input-bar { padding: 16px 5% 20px 5%; }
      #sidebar { width: 220px; }
    }
  </style>
</head>
<body>

  <!-- 좌측 사이드바 -->
  <aside id="sidebar">
    <div class="sidebar-title">Workspaces</div>
    <button class="new-btn" onclick="createNewSession()">+ 새 메모 세션</button>

    <div class="sidebar-title" style="margin-top: 10px;">Recent Sessions</div>
    <div class="session-list" id="sessionList"></div>

    <div class="sidebar-title">Engine Model</div>
    <select class="select-box" id="modelSelector">
      <option value="nemotron">Nemotron 120B (NVIDIA)</option>
      <option value="llama31">Llama 3.1 405B (Meta)</option>
      <option value="vertex-agy" selected>Vertex AI (agy Core)</option>
    </select>

    <div class="sidebar-title">Remaining Quota</div>
    <div class="usage-panel">
      <div class="gauge-label"><span>5시간 세션</span><span id="sessionQuotaText">88%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="sessionQuotaBar" style="width: 88%;"></div></div>
      <div class="gauge-label" style="margin-top:4px;"><span>주간 쿼터</span><span id="weeklyQuotaText">94%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="weeklyQuotaBar" style="width: 94%; background: #3b82f6;"></div></div>
    </div>
  </aside>

  <!-- 메인 피드 -->
  <main id="main">
    <div class="header-bar">
      <span id="currentSessionTitle">메모 세션 #1</span>
      <span id="stealthBadge" style="font-size:11px; color:#52525b;">Encrypted Memo Mode</span>
    </div>

    <div class="feed-container" id="feedContainer"></div>

    <div class="input-bar">
      <textarea id="promptInput" placeholder="질문이나 메모할 내용을 입력하세요... (Enter로 전송, Shift+Enter 줄바꿈)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">작성</button>
    </div>
  </main>

  <script>
    let sessions = JSON.parse(localStorage.getItem("agy_sessions") || "[]");
    let currentSessionId = localStorage.getItem("agy_current_session") || null;

    function scrollToBottom(force = false) {
      const feed = document.getElementById("feedContainer");
      setTimeout(() => {
        feed.scrollTo({
          top: feed.scrollHeight,
          behavior: force ? "auto" : "smooth"
        });
      }, 30);
    }

    function init() {
      if (!sessions.length) {
        const newId = "sess_" + Date.now();
        sessions.push({
          id: newId,
          title: "메모 세션 #1",
          items: []
        });
        currentSessionId = newId;
        saveSessions();
      } else if (!currentSessionId) {
        currentSessionId = sessions[0].id;
      }
      renderSessionList();
      renderFeed();
    }

    function saveSessions() {
      localStorage.setItem("agy_sessions", JSON.stringify(sessions));
      localStorage.setItem("agy_current_session", currentSessionId);
    }

    function createNewSession() {
      const newId = "sess_" + Date.now();
      sessions.unshift({
        id: newId,
        title: `메모 세션 #${sessions.length + 1}`,
        items: []
      });
      currentSessionId = newId;
      saveSessions();
      renderSessionList();
      renderFeed();
    }

    function switchSession(id) {
      currentSessionId = id;
      saveSessions();
      renderSessionList();
      renderFeed();
    }

    function getCurrentSession() {
      return sessions.find(s => s.id === currentSessionId) || sessions[0];
    }

    function renderSessionList() {
      const listEl = document.getElementById("sessionList");
      listEl.innerHTML = "";
      sessions.forEach(sess => {
        const item = document.createElement("div");
        item.className = `session-item ${sess.id === currentSessionId ? 'active' : ''}`;
        item.textContent = sess.title || "새 메모 세션";
        item.onclick = () => switchSession(sess.id);
        listEl.appendChild(item);
      });
      const cur = getCurrentSession();
      document.getElementById("currentSessionTitle").textContent = cur ? cur.title : "메모";
    }

    function renderFeed() {
      const feed = document.getElementById("feedContainer");
      feed.innerHTML = "";
      const sess = getCurrentSession();
      if (!sess || !sess.items || sess.items.length === 0) {
        feed.innerHTML = `<div style="color: #4b5563; font-size: 13px; text-align: center; margin-top: 40px;">새로운 질문이나 아이디어를 남기면 백그라운드 연산 후 댓글로 추가됩니다.</div>`;
        return;
      }

      sess.items.forEach(pair => {
        const block = document.createElement("div");
        block.className = "comment-block";

        // 질문 카드
        const qCard = document.createElement("div");
        qCard.className = "card question";
        qCard.innerHTML = `<div class="meta-tag"><span>USER NOTE</span><span>${pair.time || ''}</span></div><div>${escapeHtml(pair.question)}</div>`;
        block.appendChild(qCard);

        // 답변 카드 (있을 경우에만)
        if (pair.answer !== undefined) {
          const aCard = document.createElement("div");
          aCard.className = "card answer";
          aCard.innerHTML = `<div class="meta-tag"><span style="color:#10b981;">ENGINE RESPONSE (${escapeHtml(pair.model || 'agy')})</span></div><div>${escapeHtml(pair.answer)}</div>`;
          block.appendChild(aCard);
        }

        feed.appendChild(block);
      });

      // 마지막 메시지까지 확실히 보이도록 스크롤 하단 이동
      scrollToBottom(true);
    }

    async function sendMessage() {
      const input = document.getElementById("promptInput");
      const text = input.value.trim();
      if (!text) return;

      const btn = document.getElementById("sendBtn");
      const selectedModel = document.getElementById("modelSelector").value;
      input.value = "";
      btn.disabled = true;

      const sess = getCurrentSession();
      if (sess.items.length === 0) {
        sess.title = text.slice(0, 18) + (text.length > 18 ? '...' : '');
        renderSessionList();
      }

      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const itemIndex = sess.items.length;
      sess.items.push({
        question: text,
        time: now,
        model: selectedModel
      });
      saveSessions();
      renderFeed();

      // 로딩 카드 추가
      const feed = document.getElementById("feedContainer");
      const loadingCard = document.createElement("div");
      loadingCard.className = "card answer loading";
      loadingCard.id = "loadingAnswer";
      loadingCard.innerHTML = `<div class="spinner"></div><span>연산 중... 답변을 완성하고 있습니다.</span>`;
      feed.appendChild(loadingCard);
      scrollToBottom();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: text,
            model: selectedModel,
            sessionId: sess.id
          })
        });

        const data = await response.json();
        const answerText = data.reply || data.output || "응답을 받아오지 못했습니다.";
        sess.items[itemIndex].answer = answerText;
      } catch (err) {
        sess.items[itemIndex].answer = "[연결 실패]: 백엔드 서버 응답이 없습니다.";
      } finally {
        saveSessions();
        renderFeed();
        btn.disabled = false;
        input.focus();
        scrollToBottom();
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Enter 키로 전송, Shift+Enter 줄바꿈
    document.getElementById("promptInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    window.onload = init;
  </script>
</body>
</html>
