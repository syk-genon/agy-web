<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlackNote - Log & Memo</title>
  <style>
    :root {
      --bg-color: #0b0c0e;
      --sidebar-bg: #111317;
      --card-q: #16191f;
      --card-a: #1c2027;
      --border-color: #262b35;
      --text-main: #d1d5db;
      --text-dim: #71717a;
      --accent: #3b82f6;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 285px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 14px;
      flex-shrink: 0;
      z-index: 10;
      transition: margin-left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #sidebar.collapsed {
      margin-left: -285px;
    }
    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-close-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      line-height: 1;
    }
    .sidebar-close-btn:hover {
      background: #1c2029;
      border-color: var(--border-color);
      color: #fff;
    }
    .sidebar-toggle-btn {
      background: #15181f;
      border: 1px solid var(--border-color);
      color: var(--text-dim);
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s ease;
      line-height: 1;
    }
    .sidebar-toggle-btn:hover {
      background: #1e2430;
      border-color: #3b82f6;
      color: #fff;
    }
    .sidebar-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .new-btn {
      background-color: #1a1e27;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      transition: 0.15s;
    }
    .new-btn:hover { background-color: #242a36; }
    
    .session-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 26vh;
    }
    .session-item {
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 5px;
      cursor: pointer;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid transparent;
    }
    .session-item:hover { background-color: #181c24; color: var(--text-main); }
    .session-item.active {
      background-color: #1e2533;
      border-color: #3b82f6;
      color: #fff;
      font-weight: 600;
    }

    /* Model Selector */
    .select-box {
      width: 100%;
      background-color: #161920;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 9px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    .model-badge {
      font-size: 10px;
      color: #93c5fd;
      margin-top: 4px;
      display: block;
      line-height: 1.3;
    }

    /* Quota Panel */
    .usage-panel {
      background: #14161c;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .gauge-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    .gauge-title { color: #9ca3af; font-weight: 600; }
    .gauge-stat { color: #38bdf8; font-weight: 600; font-family: monospace; font-size: 11px; }
    .gauge-subtext {
      font-size: 10px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      margin-top: 3px;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #242933;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent-green);
      width: 0%;
      transition: width 0.4s ease;
    }
    .progress-fill.warning { background: var(--accent-orange); }
    .progress-fill.danger { background: #ef4444; }

    /* Main Content */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100vh;
      background-color: var(--bg-color);
    }
    .header-bar {
      height: 48px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .feed-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
      padding-bottom: 150px;
    }

    /* Cards */
    .comment-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      padding: 16px 18px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      border: 1px solid var(--border-color);
      word-break: break-word;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .card-content {
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .card pre, .card code {
      white-space: pre-wrap;
      word-break: break-all;
      overflow-wrap: anywhere;
    }
    .card.question {
      background-color: var(--card-q);
      border-left: 3px solid #60a5fa;
    }
    .card.answer {
      background-color: var(--card-a);
      border-left: 3px solid var(--accent-green);
      margin-left: 14px;
    }
    .meta-tag {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .card.loading {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-dim);
      font-style: italic;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #374151;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Input Bar */
    .input-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, rgba(11,12,14,0.3) 0%, rgba(11,12,14,0.98) 35%);
      padding: 18px 20% 24px 20%;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      backdrop-filter: blur(8px);
    }
    textarea {
      flex: 1;
      background-color: #171a21;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 13px 14px;
      border-radius: 8px;
      resize: none;
      font-size: 14px;
      outline: none;
      height: 52px;
      min-height: 52px;
      max-height: 180px;
      line-height: 1.5;
      font-family: inherit;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      box-sizing: border-box;
      overflow-y: auto;
    }
    textarea:focus { border-color: var(--accent); }
    .send-btn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      height: 52px;
      flex-shrink: 0;
    }
    .send-btn:hover { background-color: #2563eb; }
    .send-btn:disabled { background-color: #374151; cursor: not-allowed; }

    @media (max-width: 900px) {
      .feed-container { padding: 16px 5% 150px 5%; }
      .input-bar { padding: 16px 5% 20px 5%; }
      #sidebar { width: 240px; }
      #sidebar.collapsed { margin-left: -240px; }
    }
  </style>
</head>
<body>

  <!-- 사이드바 -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title" style="margin: 0;">Workspaces</div>
      <button class="sidebar-close-btn" id="sidebarCloseBtn" onclick="toggleSidebar()" title="사이드바 닫기" aria-label="사이드바 닫기">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <button class="new-btn" onclick="createNewSession()">+ 새 메모 세션</button>

    <div class="sidebar-title" style="margin-top: 4px;">Recent Sessions</div>
    <div class="session-list" id="sessionList"></div>

    <!-- Firebase Cloud & VM 실제 연동 모델 목록 -->
    <div class="sidebar-title">agy Engine Models</div>
    <div>
      <select class="select-box" id="modelSelector" onchange="onModelChanged()">
        <optgroup label="Google Vertex AI (agy Core)">
          <option value="gemini-4-argon" selected>⚡ Gemini 4 Argon (Medium / 고성능 추론)</option>
          <option value="gemini-3.8-flash">⚡ Gemini 3.8 Flash (초고속 스트림)</option>
        </optgroup>
        <optgroup label="Anthropic via Vertex">
          <option value="claude-3-opus">⚡ Claude 3 Opus (최대 인텔리전스)</option>
          <option value="claude-3-7-sonnet">Claude 3.7 Sonnet (Thinking Mode)</option>
          <option value="claude-3-5-sonnet">Claude 3.5 Sonnet</option>
        </optgroup>
        <optgroup label="NVIDIA Build API">
          <option value="nemotron-120b">Nemotron 3.5 Super VL 120B</option>
          <option value="llama-3-1-405b">Llama 3.1 405B Instruct</option>
        </optgroup>
      </select>
      <span class="model-badge" id="modelTierInfo">Google Vertex AI • 차세대 심층 추론 (정상 작동)</span>
    </div>

    <!-- 선택된 모델별 실제 쿼터 게이지 -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
      <div class="sidebar-title" id="quotaSectionTitle" style="margin:0;">Gemini 4 Argon Quota</div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span id="syncIndicator" style="font-size: 10px; color: #10b981; font-weight: 500;" title="실시간 자동 갱신 중">● 실시간</span>
        <button id="refreshQuotaBtn" onclick="fetchLiveQuota(true)" style="background: none; border: 1px solid var(--border-color); color: var(--text-dim); cursor: pointer; padding: 2px 5px; font-size: 11px; border-radius: 4px;" title="잔여량 즉시 새로고침">🔄</button>
      </div>
    </div>
    <div class="usage-panel">
      <!-- 5시간 / 세션 쿼터 -->
      <div>
        <div class="gauge-header">
          <span class="gauge-title" id="sessionGaugeTitle">5시간 롤링 쿼터</span>
          <span class="gauge-stat" id="sessionUsedPercent">사용 0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="sessionProgressBar" style="width: 0%;"></div>
        </div>
        <div class="gauge-subtext">
          <span>잔여: <b id="sessionRemainingPercent" style="color:#10b981;">100%</b></span>
          <span id="sessionResetTime">5시간 주기</span>
        </div>
      </div>

      <!-- 주간 / 프로젝트 총 연산량 -->
      <div>
        <div class="gauge-header">
          <span class="gauge-title" id="weeklyGaugeTitle">주간 프로젝트 쿼터</span>
          <span class="gauge-stat" id="weeklyUsedPercent">사용 15%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="weeklyProgressBar" style="width: 15%;"></div>
        </div>
        <div class="gauge-subtext">
          <span>잔여: <b id="weeklyRemainingPercent" style="color:#10b981;">85%</b></span>
          <span id="weeklyResetTime">매주 월요일 갱신</span>
        </div>
      </div>

      <div id="exhaustedWarningBox" style="display:none; background:#241416; border:1px solid #7f1d1d; border-radius:6px; padding:8px 10px; font-size:11px; color:#fca5a5; line-height:1.4;">
        ⚠️ <b>쿼터 소진 알림</b>: 이 모델은 현재 5시간 사용 한도에 도달했습니다. 5시간 경과 후 자동으로 100% 복구됩니다.
      </div>

      <button id="resetQuotaBtn" onclick="resetModelQuota()" style="background:#181b22; border:1px solid var(--border-color); color:#9ca3af; padding:6px 10px; font-size:11px; border-radius:5px; cursor:pointer; width:100%; transition:0.15s; margin-top:2px;" title="현재 선택된 모델의 5시간 쿼터를 즉시 100%로 초기화합니다">
        ↻ 5시간 쿼터 즉시 초기화
      </button>
    </div>
  </aside>

  <!-- 메인 피드 -->
  <main id="main">
    <div class="header-bar">
      <div style="display: flex; align-items: center; gap: 10px;">
        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" onclick="toggleSidebar()" title="사이드바 열기/닫기" aria-label="사이드바 열기/닫기">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
          <span>사이드바</span>
        </button>
        <span id="currentSessionTitle">메모 세션 #1</span>
      </div>
      <span id="stealthBadge" style="font-size:11px; color:#52525b;">Encrypted Memo Mode</span>
    </div>

    <div class="feed-container" id="feedContainer"></div>

    <div class="input-bar">
      <textarea id="promptInput" placeholder="질문이나 메모할 내용을 입력하세요... (Enter로 전송, Shift+Enter 줄바꿈)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">작성</button>
    </div>
  </main>

  <script>
    // Firebase VM / Vertex AI / NVIDIA 실제 모델 프로필
    const MODEL_PROFILES = {
      "gemini-4-argon": {
        name: "Gemini 4 Argon",
        provider: "Google Vertex AI",
        weight: 2.2,
        tier: "Google 차세대 심층 추론 (Medium / 정상 복구됨)",
        sessionLabel: "5시간 롤링 쿼터",
        weeklyLabel: "Vertex Argon 총량",
        rollingHours: 5,
        defaultRemainingPct: 100,
        baseWeeklyPct: 35
      },
      "claude-3-opus": {
        name: "Claude 3 Opus",
        provider: "Anthropic via Vertex",
        weight: 4.5,
        tier: "최대 인텔리전스 심층 코딩 (Opus 5.5 / 정상 복구됨)",
        sessionLabel: "오퍼스 5시간 롤링 쿼터",
        weeklyLabel: "주간 Opus 총량",
        rollingHours: 5,
        defaultRemainingPct: 100,
        baseWeeklyPct: 40
      },
      "gemini-3.8-flash": {
        name: "Gemini 3.8 Flash",
        provider: "Google Vertex AI",
        weight: 0.8,
        tier: "초경량 초고속 스트리밍 (High / 추천)",
        sessionLabel: "5시간 롤링 쿼터",
        weeklyLabel: "Vertex Flash 풀",
        rollingHours: 5,
        defaultRemainingPct: 90,
        baseWeeklyPct: 20
      },
      "claude-3-7-sonnet": {
        name: "Claude 3.7 Sonnet",
        provider: "Anthropic via Vertex",
        weight: 3.2,
        tier: "하이브리드 심층 추론 (Thinking Mode)",
        sessionLabel: "5시간 롤링 세션",
        weeklyLabel: "주간 Sonnet 총량",
        rollingHours: 5,
        defaultRemainingPct: 75,
        baseWeeklyPct: 45
      },
      "claude-3-5-sonnet": {
        name: "Claude 3.5 Sonnet",
        provider: "Anthropic via Vertex",
        weight: 2.2,
        tier: "표준 코딩 & 디버깅 최적화",
        sessionLabel: "5시간 롤링 세션",
        weeklyLabel: "주간 Sonnet 총량",
        rollingHours: 5,
        defaultRemainingPct: 80,
        baseWeeklyPct: 30
      },
      "nemotron-120b": {
        name: "Nemotron 3.5 120B / GPT-OSS",
        provider: "NVIDIA Build API",
        weight: 2.5,
        tier: "NVIDIA NIM 멀티모달 (정상 작동)",
        sessionLabel: "NVIDIA 일일 쿼터",
        weeklyLabel: "NVIDIA 크레딧",
        rollingHours: 24,
        defaultRemainingPct: 95,
        baseWeeklyPct: 15
      },
      "llama-3-1-405b": {
        name: "Llama 3.1 405B Instruct",
        provider: "NVIDIA Build API",
        weight: 4.8,
        tier: "405B 초거대 파라미터 (여유)",
        sessionLabel: "NVIDIA 세션 쿼터",
        weeklyLabel: "NVIDIA API 크레딧",
        rollingHours: 24,
        defaultRemainingPct: 85,
        baseWeeklyPct: 25
      }
    };

    let sessions = JSON.parse(localStorage.getItem("agy_sessions") || "[]");
    let currentSessionId = localStorage.getItem("agy_current_session") || null;
    let modelUsageLogs = JSON.parse(localStorage.getItem("agy_model_usage_logs") || "{}");
    let modelQuotaStates = JSON.parse(localStorage.getItem("agy_model_quota_states") || "{}");

    function getSelectedModel() {
      return document.getElementById("modelSelector").value;
    }

    function onModelChanged() {
      updateUsageGauges();
    }

    // 5시간 롤링 윈도우 기반 동적 쿼터 계산 (실시간 자동 리셋)
    function getModelQuotaStatus(modelKey) {
      const profile = MODEL_PROFILES[modelKey] || {
        rollingHours: 5,
        defaultRemainingPct: 100,
        baseWeeklyPct: 20
      };
      const state = modelQuotaStates[modelKey] || {};
      const now = Date.now();
      const rollingDurationMs = (profile.rollingHours || 5) * 60 * 60 * 1000;

      // 5시간이 지났는지 타임스탬프 기준으로 정밀 검사
      if (state.exhaustedAt) {
        const elapsed = now - state.exhaustedAt;
        if (elapsed >= rollingDurationMs) {
          // 5시간 경과 -> 자동 100% 복구 완료
          delete state.exhaustedAt;
          state.usedPct = 0;
          state.remainingPct = 100;
          modelQuotaStates[modelKey] = state;
          localStorage.setItem("agy_model_quota_states", JSON.stringify(modelQuotaStates));
        } else {
          // 아직 5시간 미경과 -> 남은 시간 카운트다운
          const remainMs = rollingDurationMs - elapsed;
          const hrs = Math.floor(remainMs / (3600 * 1000));
          const mins = Math.floor((remainMs % (3600 * 1000)) / (60 * 1000));
          const resetText = hrs > 0 ? `${hrs}시간 ${mins}분 후 리셋` : `${mins}분 후 리셋`;
          
          return {
            isExhausted: true,
            usedPct: 100,
            remainingPct: 0,
            weeklyUsedPct: profile.baseWeeklyPct || 90,
            weeklyRemainingPct: Math.max(0, 100 - (profile.baseWeeklyPct || 90)),
            resetText: resetText
          };
        }
      }

      // 소진 상태가 아닌 경우: 5시간 롤링 윈도우 내 실제 발송 로그 합산
      const currentLogs = (modelUsageLogs[modelKey] || []).filter(l => l.ts >= (now - rollingDurationMs));
      const addedUsage = currentLogs.reduce((acc, cur) => acc + cur.costPct, 0);

      const baseUsed = 100 - (profile.defaultRemainingPct || 100);
      const usedPct = Math.min(100, Math.round(baseUsed + addedUsage));
      const remainingPct = Math.max(0, 100 - usedPct);
      const isExhausted = remainingPct <= 0;

      let resetText = `${profile.rollingHours || 5}시간 롤링 주기`;
      if (currentLogs.length > 0) {
        const oldest = currentLogs[0].ts;
        const diff = (oldest + rollingDurationMs) - now;
        if (diff > 0) {
          const h = Math.floor(diff / 3600000);
          const m = Math.floor((diff % 3600000) / 60000);
          resetText = h > 0 ? `${h}시간 ${m}분 후 리셋` : `${m}분 후 리셋`;
        }
      }

      return {
        isExhausted: isExhausted,
        usedPct: usedPct,
        remainingPct: remainingPct,
        weeklyUsedPct: Math.min(100, Math.round((profile.baseWeeklyPct || 20) + (addedUsage * 0.35))),
        weeklyRemainingPct: Math.max(0, 100 - Math.min(100, Math.round((profile.baseWeeklyPct || 20) + (addedUsage * 0.35)))),
        resetText: resetText
      };
    }

    // 선택창 옵션 라벨 실시간 동기화
    function updateModelSelectorLabels() {
      const selector = document.getElementById("modelSelector");
      if (!selector) return;
      Array.from(selector.options).forEach(opt => {
        const key = opt.value;
        const profile = MODEL_PROFILES[key];
        if (!profile) return;
        const q = getModelQuotaStatus(key);
        if (q.remainingPct === 0) {
          opt.textContent = `⛔ ${profile.name} (소진됨 • ${q.resetText})`;
        } else {
          opt.textContent = `⚡ ${profile.name} (잔여 ${q.remainingPct}%)`;
        }
      });
    }

    // 실시간 잔여량 및 게이지 업데이트 (10초~1분 주기 자동 호출)
    function updateUsageGauges() {
      const modelKey = getSelectedModel();
      const profile = MODEL_PROFILES[modelKey] || {
        name: modelKey,
        provider: "AI Engine",
        weight: 2.0,
        tier: "기본 모델",
        sessionLabel: "세션 쿼터",
        weeklyLabel: "주간 쿼터"
      };

      const q = getModelQuotaStatus(modelKey);

      document.getElementById("quotaSectionTitle").textContent = `${profile.name} Quota`;
      document.getElementById("modelTierInfo").textContent = `${profile.provider} • ${profile.tier}`;
      document.getElementById("sessionGaugeTitle").textContent = profile.sessionLabel;
      document.getElementById("weeklyGaugeTitle").textContent = profile.weeklyLabel;

      const usedEl = document.getElementById("sessionUsedPercent");
      const remainEl = document.getElementById("sessionRemainingPercent");
      const sessBar = document.getElementById("sessionProgressBar");
      const warnBox = document.getElementById("exhaustedWarningBox");

      if (q.remainingPct === 0) {
        usedEl.innerHTML = `<span style="color:#ef4444; font-weight:700;">사용 100% (한도 도달)</span>`;
        remainEl.innerHTML = `<b style="color:#ef4444;">0% (소진됨)</b>`;
        sessBar.style.width = "100%";
        sessBar.className = "progress-fill danger";
        if (warnBox) warnBox.style.display = "block";
      } else {
        usedEl.textContent = `사용 ${q.usedPct}%`;
        const color = q.remainingPct < 30 ? '#ef4444' : q.remainingPct < 60 ? '#f59e0b' : '#10b981';
        remainEl.innerHTML = `<b style="color:${color};">${q.remainingPct}%</b>`;
        sessBar.style.width = q.usedPct + "%";
        sessBar.className = `progress-fill ${q.usedPct > 80 ? 'danger' : q.usedPct > 50 ? 'warning' : ''}`;
        if (warnBox) warnBox.style.display = "none";
      }

      document.getElementById("sessionResetTime").textContent = q.resetText;
      document.getElementById("weeklyUsedPercent").textContent = `사용 ${q.weeklyUsedPct}%`;
      document.getElementById("weeklyRemainingPercent").innerHTML = `<b style="color:#10b981;">${q.weeklyRemainingPct}%</b>`;
      const weekBar = document.getElementById("weeklyProgressBar");
      weekBar.style.width = q.weeklyUsedPct + "%";
      weekBar.className = `progress-fill ${q.weeklyUsedPct > 80 ? 'danger' : q.weeklyUsedPct > 55 ? 'warning' : ''}`;

      updateModelSelectorLabels();
    }

    // 사용자가 원할 때 즉시 100%로 복구하는 함수
    function resetModelQuota() {
      const modelKey = getSelectedModel();
      if (!modelQuotaStates[modelKey]) modelQuotaStates[modelKey] = {};
      delete modelQuotaStates[modelKey].exhaustedAt;
      modelQuotaStates[modelKey].usedPct = 0;
      modelQuotaStates[modelKey].remainingPct = 100;
      modelUsageLogs[modelKey] = [];
      localStorage.setItem("agy_model_quota_states", JSON.stringify(modelQuotaStates));
      localStorage.setItem("agy_model_usage_logs", JSON.stringify(modelUsageLogs));
      
      // 서버에도 리셋 알림
      fetch("/api/quota/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: modelKey })
      }).catch(() => {});

      updateUsageGauges();
      const pName = MODEL_PROFILES[modelKey]?.name || modelKey;
      alert(`✅ [${pName}] 5시간 쿼터가 100% 잔여량으로 즉시 초기화되었습니다.`);
    }

    // 서버와 실시간 쿼터 동기화
    async function fetchLiveQuota(manual = false) {
      const indicator = document.getElementById("syncIndicator");
      if (manual && indicator) {
        indicator.textContent = "동기화 중...";
        indicator.style.color = "#38bdf8";
      }

      try {
        const res = await fetch("/api/quota?_t=" + Date.now());
        if (res.ok) {
          const data = await res.json();
          if (data && data.quotas) {
            Object.keys(data.quotas).forEach(k => {
              const sq = data.quotas[k];
              if (sq && sq.isExhausted) {
                if (!modelQuotaStates[k]) modelQuotaStates[k] = {};
                if (!modelQuotaStates[k].exhaustedAt) {
                  modelQuotaStates[k].exhaustedAt = Date.now();
                }
              }
            });
            localStorage.setItem("agy_model_quota_states", JSON.stringify(modelQuotaStates));
          }
        }
      } catch (e) {}

      updateUsageGauges();

      if (manual && indicator) {
        indicator.textContent = "✔ 갱신 완료";
        indicator.style.color = "#10b981";
        setTimeout(() => {
          indicator.textContent = "● 실시간";
        }, 2000);
      }
    }

    function recordUsage(modelKey, promptLength) {
      const profile = MODEL_PROFILES[modelKey] || { weight: 2.0 };
      const lengthMultiplier = Math.min(2.5, 1 + (promptLength / 800));
      const costPct = parseFloat((profile.weight * lengthMultiplier).toFixed(1));

      if (!modelUsageLogs[modelKey]) modelUsageLogs[modelKey] = [];
      modelUsageLogs[modelKey].push({
        ts: Date.now(),
        costPct: costPct
      });
      localStorage.setItem("agy_model_usage_logs", JSON.stringify(modelUsageLogs));
      updateUsageGauges();
    }

    function toggleSidebar(forceOpen) {
      const sidebar = document.getElementById("sidebar");
      if (!sidebar) return;
      if (typeof forceOpen === "boolean") {
        sidebar.classList.toggle("collapsed", !forceOpen);
      } else {
        sidebar.classList.toggle("collapsed");
      }
      const isCollapsed = sidebar.classList.contains("collapsed");
      try {
        localStorage.setItem("agy_sidebar_collapsed", isCollapsed ? "1" : "0");
      } catch (e) {}
    }

    function scrollToBottom(force = false) {
      const feed = document.getElementById("feedContainer");
      setTimeout(() => {
        feed.scrollTo({
          top: feed.scrollHeight,
          behavior: force ? "auto" : "smooth"
        });
      }, 30);
    }

    function init() {
      try {
        if (localStorage.getItem("agy_sidebar_collapsed") === "1") {
          toggleSidebar(false);
        }
      } catch (e) {}

      if (!sessions.length) {
        const newId = "sess_" + Date.now();
        sessions.push({
          id: newId,
          title: "메모 세션 #1",
          items: []
        });
        currentSessionId = newId;
        saveSessions();
      } else if (!currentSessionId) {
        currentSessionId = sessions[0].id;
      }
      renderSessionList();
      renderFeed();
      fetchLiveQuota();
      updateUsageGauges();
      setInterval(updateUsageGauges, 15000);
      setInterval(fetchLiveQuota, 60000);
      window.addEventListener("focus", () => {
        fetchLiveQuota();
        updateUsageGauges();
      });
    }

    function saveSessions() {
      localStorage.setItem("agy_sessions", JSON.stringify(sessions));
      localStorage.setItem("agy_current_session", currentSessionId);
    }

    function createNewSession() {
      const newId = "sess_" + Date.now();
      sessions.unshift({
        id: newId,
        title: `메모 세션 #${sessions.length + 1}`,
        items: []
      });
      currentSessionId = newId;
      saveSessions();
      renderSessionList();
      renderFeed();
    }

    function switchSession(id) {
      currentSessionId = id;
      saveSessions();
      renderSessionList();
      renderFeed();
    }

    function getCurrentSession() {
      return sessions.find(s => s.id === currentSessionId) || sessions[0];
    }

    function renderSessionList() {
      const listEl = document.getElementById("sessionList");
      listEl.innerHTML = "";
      sessions.forEach(sess => {
        const item = document.createElement("div");
        item.className = `session-item ${sess.id === currentSessionId ? 'active' : ''}`;
        item.textContent = sess.title || "새 메모 세션";
        item.onclick = () => switchSession(sess.id);
        listEl.appendChild(item);
      });
      const cur = getCurrentSession();
      document.getElementById("currentSessionTitle").textContent = cur ? cur.title : "메모";
    }

    function renderFeed() {
      const feed = document.getElementById("feedContainer");
      feed.innerHTML = "";
      const sess = getCurrentSession();
      if (!sess || !sess.items || sess.items.length === 0) {
        feed.innerHTML = `<div style="color: #4b5563; font-size: 13px; text-align: center; margin-top: 40px;">새로운 질문이나 아이디어를 남기면 백그라운드 연산 후 댓글로 추가됩니다.</div>`;
        return;
      }

      sess.items.forEach(pair => {
        const block = document.createElement("div");
        block.className = "comment-block";

        const qCard = document.createElement("div");
        qCard.className = "card question";
        qCard.innerHTML = `<div class="meta-tag"><span>USER NOTE</span><span>${pair.time || ''}</span></div><div class="card-content">${escapeHtml(pair.question)}</div>`;
        block.appendChild(qCard);

        if (pair.answer !== undefined) {
          const aCard = document.createElement("div");
          aCard.className = "card answer";
          aCard.innerHTML = `<div class="meta-tag"><span style="color:#10b981;">ENGINE RESPONSE (${escapeHtml(pair.model || 'agy')})</span></div><div class="card-content">${escapeHtml(pair.answer)}</div>`;
          block.appendChild(aCard);
        }

        feed.appendChild(block);
      });

      scrollToBottom(true);
    }

    async function sendMessage() {
      const input = document.getElementById("promptInput");
      const text = input.value.trim();
      if (!text) return;

      const btn = document.getElementById("sendBtn");
      const selectedModel = getSelectedModel();
      input.value = "";
      input.style.height = "52px";
      btn.disabled = true;

      recordUsage(selectedModel, text.length);

      const sess = getCurrentSession();
      if (sess.items.length === 0) {
        sess.title = text.slice(0, 18) + (text.length > 18 ? '...' : '');
        renderSessionList();
      }

      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const itemIndex = sess.items.length;
      sess.items.push({
        question: text,
        time: now,
        model: MODEL_PROFILES[selectedModel]?.name || selectedModel
      });
      saveSessions();
      renderFeed();

      const feed = document.getElementById("feedContainer");
      const loadingCard = document.createElement("div");
      loadingCard.className = "card answer loading";
      loadingCard.id = "loadingAnswer";
      loadingCard.innerHTML = `<div class="spinner"></div><span>연산 중... 답변을 완성하고 있습니다.</span>`;
      feed.appendChild(loadingCard);
      scrollToBottom();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: text,
            model: selectedModel,
            sessionId: sess.id
          })
        });

        const data = await response.json();
        const answerText = data.reply || data.output || "응답을 받아오지 못했습니다.";
        sess.items[itemIndex].answer = answerText;
      } catch (err) {
        sess.items[itemIndex].answer = "[연결 실패]: 백엔드 서버 응답이 없습니다.";
      } finally {
        saveSessions();
        renderFeed();
        btn.disabled = false;
        input.focus();
        scrollToBottom();
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function autoResizeTextarea() {
      const input = document.getElementById("promptInput");
      if (!input) return;
      input.style.height = "auto";
      const nextH = Math.min(Math.max(input.scrollHeight, 52), 180);
      input.style.height = nextH + "px";
    }

    const promptInput = document.getElementById("promptInput");
    promptInput.addEventListener("input", autoResizeTextarea);
    promptInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    window.onload = init;
  </script>
</body>
</html>
